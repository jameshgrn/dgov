[tasks.policy]
summary = "Promote Lacustrine Pillars into policy guidance"
commit_message = "Promote Lacustrine pillars to governance policy"
role = "worker"
provider = "claude"
iteration_budget = 25
files.edit = [
  ".dgov/governor.md",
  ".dgov/sops/architecture.md",
  "tests/test_boundaries.py",
]
files.read = [
  "src/dgov/actions.py",
  "src/dgov/dag_parser.py",
  "src/dgov/deploy_log.py",
  "src/dgov/plan.py",
  "src/dgov/plan_tree.py",
  "src/dgov/runner.py",
  "src/dgov/settlement.py",
  "src/dgov/worker.py",
  "src/dgov/workers/atomic.py",
  "src/dgov/workers/headless.py",
  "src/dgov/worktree.py",
]
test_cmd = "uv run pytest -q -m unit tests/test_boundaries.py -k Lacustrine"
prompt = """
Orient:
- Read `.dgov/governor.md` Core Principles and `.dgov/sops/architecture.md`.
- Read `tests/test_boundaries.py` around `TestLacustrinePillarVisibility`.
- Search the claimed read-only source files for existing `Pillar #` markers. Promote existing canonical wording; do not invent a missing pillar definition if the source does not contain one.
- The goal is policy promotion: the Lacustrine Pillars should become a governor/SOP contract workers and reviewers can receive, not only source-header comments.

Edit:
1. Add a concise Lacustrine Pillars policy section to `.dgov/governor.md`, near Core Principles, making it clear these pillars are governance constraints for plans, worker boundaries, settlement, and reviews.
2. Add matching architecture SOP guidance in `.dgov/sops/architecture.md`, including When/Do/Verify language that directs workers/reviewers to preserve the pillars when changing architecture, state, runner/worktree, worker, settlement, plan, or persistence boundaries.
3. Update `tests/test_boundaries.py` with focused assertions that `.dgov/governor.md` and `.dgov/sops/architecture.md` keep the Lacustrine Pillars visible. Reuse exact visible pillar phrases where practical. Keep the test narrow and fast.
4. Do not modify generated bootstrap mirrors under `src/dgov/bootstrap_policy_data/`.

Verify:
- `uv run pytest -q -m unit tests/test_boundaries.py -k Lacustrine`
- `uv run ruff check tests/test_boundaries.py`
- `uv run ruff format --check tests/test_boundaries.py`
"""
