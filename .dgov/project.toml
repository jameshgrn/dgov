[project]
language = "python"
src_dir = "src/"
test_dir = "tests/"
source_extensions = [".py"]
provider = "claude"
test_cmd = "uv run pytest -q -m unit {test_dir} --tb=short"
lint_cmd = "uv run ruff check {file}"
format_cmd = "uv run ruff format {file}"
lint_fix_cmd = "uv run ruff check --fix {file}"
format_check_cmd = "uv run ruff format --check {file}"
type_check_cmd = "uv run ty check"
test_markers = ["unit", "integration"]
worker_iteration_budget = 75
worker_iteration_warn_at = 60
worker_tree_max_lines = 0
settlement_timeout = 120
review_hooks = [
    "! file --mime {files} | grep -q 'charset=binary'",
    "! grep -rE '(sk-[a-zA-Z0-9]{24,}|AI_[A-Z0-9_]{24,})' {files}"
]

[providers.fireworks]
default_agent = "accounts/fireworks/routers/kimi-k2p6-turbo"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
token_limit_label = "Fireworks adaptive serverless TPM"
prompt_token_limit_header = "x-ratelimit-limit-tokens-prompt"
generated_token_limit_header = "x-ratelimit-limit-tokens-generated"

[providers.local]
default_agent = "unsloth/gemma-4-26b-a4b-it-UD-MLX-4bit"
base_url = "http://localhost:8080/v1"
api_key_env = "LOCAL_LLM_API_KEY"
max_tokens = 262144

[providers.claude]
default_agent = "sonnet"
base_url = "claude-code://daily?max_turns=32&timeout=1200"

[providers.claude-haiku-worker]
default_agent = "haiku"
base_url = "claude-code://fast?preset=edit&max_turns=18&timeout=1200"

[providers.claude-haiku-plan]
default_agent = "haiku"
base_url = "claude-code://fast?preset=plan&max_turns=18&timeout=1200"

[providers.claude-sonnet-review]
default_agent = "sonnet"
base_url = "claude-code://daily?preset=review&max_turns=32&timeout=1200"

[providers.claude-sonnet-plan]
default_agent = "sonnet"
base_url = "claude-code://daily?preset=plan&max_turns=32&timeout=1200"

[tool_policy]
restrict_run_bash = true
require_wrapped_verify_tools = true
require_uv_run = true
deny_shell_file_mutations = true
deny_network_egress = true
deny_shell_commands = ["pip", "python -m pip", "pip3", "python -m venv", "uv venv"]

[sentrux]
mode = "diff"
stale_commits = 10
stale_days = 14

[agents]
kimi = "accounts/fireworks/routers/kimi-k2p6-turbo"
"kimi-k2.6" = "accounts/fireworks/routers/kimi-k2p6-turbo"
"gemma-4-26b-a4b" = "unsloth/gemma-4-26b-a4b-it-UD-MLX-4bit"
"claude" = "sonnet"
"claude-haiku" = "haiku"
"claude-sonnet" = "sonnet"

[conventions]
test_framework = "pytest"
fixture_style = "function-scoped, in conftest.py or inline"
imports = "absolute only, ruff-enforced"
type_checking = "ty check"
no_commented_code = "delete it, don't comment it out"
error_handling = "fail fast with context, never swallow exceptions"
